services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: ${MSSQL_PID:-Express}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set database admin password}
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: [CMD-SHELL, 'SQLCMDPASSWORD=$$MSSQL_SA_PASSWORD /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -Q "SELECT 1" -b -o /dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
      args:
        NEXT_PUBLIC_API_URL: https://${SITE_ADDRESS:?Set public hostname}
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set private SQL URL with a dedicated application login}
      JWT_SECRET: ${JWT_SECRET:?Set JWT secret}
      AI_SERVICE_KEY: ${AI_SERVICE_KEY:?Set batch secret}
      FRONTEND_URL: https://${SITE_ADDRESS}
    volumes:
      - uploads:/data/uploads
      - menu-uploads:/data/menu-uploads
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_URL: https://${SITE_ADDRESS}
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports: ["80:80", "443:443"]
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]
    restart: unless-stopped
volumes:
  sql-data:
  uploads:
  menu-uploads:
  caddy-data:
  caddy-config:

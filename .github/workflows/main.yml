name: Replate CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate and generate database client
        run: pnpm --dir backend prisma:validate && pnpm --dir backend prisma:generate

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  ai:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: AI/requirements.txt
      - run: pip install -r AI/requirements.txt
      - name: Check forecasting and synthetic demo
        working-directory: AI
        run: |
          python -m unittest discover -s tests -v
          mkdir -p artifacts
          python demo_data.py artifacts/demo-data.json
          python recommend.py --input artifacts/demo-data.json --target-date 2026-11-04 --report artifacts/evaluation-demo.json
